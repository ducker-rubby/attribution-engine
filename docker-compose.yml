services: 
    postgres:
      image: postgres:18-alpine
      container_name: attribution_postgres
      environment: 
        POSTGRES_PASSWORD: admin
        POSTGRES_USER: postgres
        POSTGRES_DB: attributiondb
      ports:
        - '5432:5432'
      volumes:
          - postgres-data:/var/lib/postgresql
    redis: 
      image: redis:8.8.2-alpine
      container_name: attribution_redis
      ports: 
        - '6379:6379'
      volumes:
        - redis-data:/data/redis
      restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
